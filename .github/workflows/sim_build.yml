name: Simulator Build (unsigned, no secrets)

# Replaces a local Xcode build: compiles the full Trio app for the iOS
# Simulator on a GitHub macOS runner. No Apple certificates or secrets needed.
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'alive*'
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Trio (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Capture submodule state for cache key
        run: git submodule status --recursive | awk '{print $1, $2}' > .submodule-status

      - name: Install relay dependencies
        run: npm ci --prefix tools/trio-mcp --ignore-scripts --no-audit --no-fund

      - name: Test AI relay with synthetic data
        run: node --test tools/trio-mcp/*.test.mjs

      - name: Restore DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-xcode26.2-simdd-v2-${{ hashFiles('**/Package.resolved', '.submodule-status') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode26.2-simdd-v2-${{ hashFiles('**/Package.resolved', '.submodule-status') }}-

      - name: Cache BuildTools (SwiftFormat)
        uses: actions/cache@v5
        with:
          path: BuildTools/.build
          key: ${{ runner.os }}-buildtools-${{ hashFiles('BuildTools/Package.swift', 'BuildTools/Package.resolved') }}

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Trio.xcworkspace \
            -scheme "Trio" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.2" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | tee xcodebuild.log

      - name: Test AI providers, settings catalog and proposal diff
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Trio.xcworkspace \
            -scheme "Trio Tests" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=26.2" \
            -only-testing:TrioTests/ClaudeBridgeDiffTests \
            -only-testing:TrioTests/AIMealProviderTests \
            -only-testing:TrioTests/ClaudeSettingsCatalogTests \
            -only-testing:TrioTests/AIAdditionalSettingsTests \
            -only-testing:TrioTests/AIBridgeSetupTests \
            -resultBundlePath "$RUNNER_TEMP/claude-bridge-tests.xcresult" \
            -parallel-testing-enabled NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -quiet \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee -a xcodebuild.log

      - name: Verify selected AI tests ran
        run: |
          set -o pipefail
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/claude-bridge-tests.xcresult" \
            | tee "$RUNNER_TEMP/claude-bridge-tests.json"
          minimum_tests=$(python3 -c 'from pathlib import Path; print(sum(Path("TrioTests/" + name + ".swift").read_text().count("@Test(") for name in ["ClaudeBridgeDiffTests", "AIMealProviderTests", "ClaudeSettingsCatalogTests", "AIAdditionalSettingsTests", "AIBridgeSetupTests"]))')
          jq -e --argjson minimum "$minimum_tests" '.totalTestCount >= $minimum and .passedTests == .totalTestCount and .failedTests == 0 and .skippedTests == 0' \
            "$RUNNER_TEMP/claude-bridge-tests.json"

      - name: Upload Claude diff test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-bridge-test-results
          path: |
            ${{ runner.temp }}/claude-bridge-tests.xcresult
            ${{ runner.temp }}/claude-bridge-tests.json
          if-no-files-found: ignore

      - name: Surface build errors
        if: failure()
        run: |
          grep -nE "error:|Undefined symbol|PhaseScriptExecution failed|BUILD FAILED" xcodebuild.log | tail -n 80 || true
          { echo '## ❌ Build failed'; echo '```'; grep -E "error:" xcodebuild.log | head -n 40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Success summary
        if: success()
        run: echo "✅ Trio builds for iOS Simulator; AI relay, provider, settings and diff tests passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
